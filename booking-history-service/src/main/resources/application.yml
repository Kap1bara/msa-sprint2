server:
  port: ${HISTORY_HTTP_PORT:8086}

spring:
  datasource:
    url: jdbc:postgresql://${HISTORY_DB_HOST:history-db}:${HISTORY_DB_PORT:5432}/${HISTORY_DB_NAME:history}
    username: ${HISTORY_DB_USER:history}
    password: ${HISTORY_DB_PASSWORD:history}
  jpa:
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${HISTORY_KAFKA_GROUP:booking-history}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

booking:
  kafka:
    topic: ${BOOKING_EVENTS_TOPIC:booking-events}
