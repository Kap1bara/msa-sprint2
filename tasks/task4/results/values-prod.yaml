replicaCount: 3

image:
  name: booking-service
  tag: prod
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Prod: feature enabled
ENABLE_FEATURE_X: "true"

env:
  - name: LOG_LEVEL
    value: "info"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
