stages:
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_NAME: booking-service
  # For gitlab-ci-local this may be empty; fall back to 'local'
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  HELM_RELEASE: booking-service
  HELM_CHART_DIR: "helm/booking-service"
  VALUES_FILE: "results/values-staging.yaml"

before_script:
  - export IMAGE_TAG="${IMAGE_TAG:-local}"

build:
  stage: build
  script:
    - docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" ./booking-service
    - docker image ls | grep booking-service || true

# Unit tests stage (only if you add tests later)
unit_test:
  stage: test
  script:
    - echo "No unit tests configured" 
  rules:
    - when: manual
      allow_failure: true

test:
  stage: test
  script:
    - docker rm -f booking-service-test 2>/dev/null || true
    - docker run -d --name booking-service-test -p 18080:8080 "${IMAGE_NAME}:${IMAGE_TAG}"
    - |
      for i in $(seq 1 20); do
        if curl -fsS "http://localhost:18080/ping" >/dev/null; then
          echo "✅ /ping OK";
          break;
        fi
        sleep 0.5
      done
    - curl -fsS "http://localhost:18080/ping"
    - docker rm -f booking-service-test

deploy:
  stage: deploy
  script:
    - minikube status
    - minikube image load "${IMAGE_NAME}:${IMAGE_TAG}"
    - helm upgrade --install "${HELM_RELEASE}" "${HELM_CHART_DIR}" -f "${VALUES_FILE}" --set image.name="${IMAGE_NAME}" --set image.tag="${IMAGE_TAG}"
    - kubectl rollout status deployment/booking-service --timeout=120s
    - kubectl get pods -l app=booking-service
    - kubectl get svc booking-service

tag:
  stage: tag
  script:
    - TS=$(date -u +"%Y%m%d%H%M%S")
    - TAG="deploy-${TS}"
    - echo "Creating tag ${TAG}"
    - git tag "${TAG}" || true
    - git tag | tail -n 10
