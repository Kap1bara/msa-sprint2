apiVersion: v1
kind: Service
metadata:
  name: booking-service
  labels:
    app: booking-service
spec:
  selector:
    app: booking-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service-v1
  labels:
    app: booking-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: booking-service
      version: v1
  template:
    metadata:
      labels:
        app: booking-service
        version: v1
    spec:
      containers:
        - name: booking-service
          image: booking-service:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: ENABLE_FEATURE_X
              value: "false"
            - name: APP_VERSION
              value: "v1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /ping, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service-v2
  labels:
    app: booking-service
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
      version: v2
  template:
    metadata:
      labels:
        app: booking-service
        version: v2
    spec:
      containers:
        - name: booking-service
          image: booking-service:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: ENABLE_FEATURE_X
              value: "false"
            - name: APP_VERSION
              value: "v2"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /ping, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
